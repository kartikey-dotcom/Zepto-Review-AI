version: '3.8'

services:
  zepto-reviews-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zepto_reviews_ai_app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./zepto_reviews.db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL_NAME=gemini-flash-latest
      - GOOGLE_AI_STUDIO_RPM_LIMIT=60
      - GOOGLE_AI_STUDIO_TPM_LIMIT=100000
    volumes:
      - zepto_db_data:/app/data
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  zepto_db_data:
